# Example for Nginx RUNNING ON THE DOCKER HOST. Use a dedicated subdomain.
# Replace domain and certificate paths. Do not overwrite your existing nginx.conf.
# Set WEB_PUBLIC_URL=https://vision.example.com and recreate the app container.
server {
    listen 80;
    listen [::]:80;
    server_name vision.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vision.example.com;
    ssl_certificate /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    client_body_timeout 10s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /healthz { return 404; }
    location / {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        # Application does not trust forwarded identity/scheme headers.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
# If Nginx itself runs in Docker, 127.0.0.1 above points to that container,
# NOT the host. Put both services on a private Docker network and proxy to
# app:9080 instead; keep the app port off the public interface.
